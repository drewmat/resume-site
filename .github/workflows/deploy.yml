name: Deploy Infrastructure

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (overrides branch detection)'
        required: false
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write  # Required for OIDC auth

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Resolve environment from branch name
  # ─────────────────────────────────────────────
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      tf_dir:      ${{ steps.set-env.outputs.tf_dir }}

    steps:
      - name: Determine environment and Terraform directory
        id: set-env
        run: |
          # workflow_dispatch input takes priority, otherwise derive from branch
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi

          echo "environment=$ENV"                       >> $GITHUB_OUTPUT
          echo "tf_dir=terraform/environments/$ENV"     >> $GITHUB_OUTPUT
          echo "▶ Environment : $ENV"
          echo "▶ Terraform dir: terraform/environments/$ENV"

  # ─────────────────────────────────────────────
  # JOB 1: Terraform — provision / update infra
  # ─────────────────────────────────────────────
  terraform:
    name: Terraform Plan & Apply (${{ needs.resolve-env.outputs.environment }})
    runs-on: ubuntu-latest
    needs: resolve-env

    environment: ${{ needs.resolve-env.outputs.environment }}

    env:
      TF_DIR: ${{ needs.resolve-env.outputs.tf_dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # Disable wrapper so outputs are plain strings

      - name: Terraform Init
        run: terraform -chdir="$TF_DIR" init -input=false

      - name: Terraform Validate
        run: terraform -chdir="$TF_DIR" validate

      - name: Terraform Plan
        run: terraform -chdir="$TF_DIR" plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform -chdir="$TF_DIR" apply -input=false -auto-approve tfplan
